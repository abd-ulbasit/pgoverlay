# pgoverlay docs site. .github/workflows/docs.yml builds it with --strict on
# every pull request that touches docs/ and publishes it to GitHub Pages from
# main. Preview locally:
#   pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7" && mkdocs serve
site_name: pgoverlay
site_url: https://abd-ulbasit.github.io/pgoverlay/
site_description: "git branch for Postgres: instant copy-on-write database branches"
repo_url: https://github.com/abd-ulbasit/pgoverlay
repo_name: abd-ulbasit/pgoverlay
edit_uri: ""

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Ways to use it: usage.md
  - Reference:
      - Commands and configuration: reference.md
      - REST API: api.md
      - Troubleshooting: troubleshooting.md
      - Upgrading to v1.0: upgrading.md
      - Changelog: https://github.com/abd-ulbasit/pgoverlay/blob/main/CHANGELOG.md
  - How it works:
      - Core concepts: concepts.md
      - Architecture: architecture.md
      - Code tour: code-tour.md
      - Design decisions (ADRs): DESIGN-DECISIONS.md
      - Deep dives: deep-dives.md
      - Benchmarks: benchmarks.md
  - Testing: testing.md
  - Kubernetes: kubernetes.md
  - Running on EKS: eks.md
  - GitHub App: github-app.md
  - Observability: observability.md
  - High availability: ha.md
  - Security: security.md
  - ZFS backend (experimental): zfs.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
