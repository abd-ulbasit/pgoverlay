# branchd manages branch/helper pods in its own namespace only. Anyone who
# installs this chart must hold every rule below themselves (Kubernetes RBAC
# escalation prevention); deploy/preview-deployer-rbac.yaml is kept a
# superset, and internal/deploy tests that it stays one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pgoverlay.fullname" . }}
  labels:
    {{- include "pgoverlay.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Helper pods read their environment (the source password when seeding)
  # from a short-lived Secret branchd creates with the pod and deletes once
  # the container has started, so it never sits in a Pod spec. No get/list:
  # branchd never reads Secrets back.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  {{- if eq .Values.storage.mode "csi" }}
  # csi storage: branchd provisions PVCs (sources, branch clones) and — when
  # storage.snapshotClass is set — VolumeSnapshots, in its own namespace.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list"]
  {{- end }}
  {{- if eq (include "pgoverlay.leaderElectionEnabled" .) "true" }}
  # HA leader election: branchd reads/writes the pgoverlay-branchd Lease in its
  # own namespace to elect a single reconciling/writing leader.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "watch", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pgoverlay.fullname" . }}
  labels:
    {{- include "pgoverlay.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pgoverlay.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pgoverlay.fullname" . }}
    namespace: {{ .Release.Namespace }}
