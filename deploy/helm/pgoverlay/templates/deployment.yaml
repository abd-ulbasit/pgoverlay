apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgoverlay.fullname" . }}
  labels:
    {{- include "pgoverlay.labels" . | nindent 4 }}
spec:
  # sqlite registry = single writer. replicaCount defaults to 1; >1 is an HA
  # standby set guarded by leader election (only the leader writes), NOT
  # horizontal scaling. Recreate keeps the RWO PVC from being double-attached
  # mid-rollout.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pgoverlay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pgoverlay.selectorLabels" . | nindent 8 }}
      annotations:
        # Prometheus pod-scrape discovery: branchd serves /metrics on the API
        # port without auth (see docs/observability.md).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "pgoverlay.fullname" . }}
      {{- if eq (include "pgoverlay.pinNode" .) "true" }}
      # Pinned to the storage node: in hostpath mode the CoW volumes live on
      # its disk, and without persistence so does branchd's sqlite state.
      nodeName: {{ required "set node to the storage node name (kubectl get nodes)" .Values.node }}
      {{- end }}
      # On SIGTERM branchd drains in-flight sagas for --shutdown-timeout, then
      # cancels and rolls back the rest (up to 15s more) before it exits; the
      # kubelet must not SIGKILL it first.
      terminationGracePeriodSeconds: {{ add (int .Values.shutdownTimeout) 30 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if and (ne (include "pgoverlay.pinNode" .) "true") (gt (int .Values.replicaCount) 1) }}
      # Unpinned HA: every replica mounts the same ReadWriteOnce state PVC, so
      # they must share a node. The first replica goes wherever the scheduler
      # (and the volume's topology) puts it; the others follow it.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "pgoverlay.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: branchd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if not (has .Values.storage.mode (list "hostpath" "csi")) }}
          {{- fail "storage.mode must be hostpath or csi" }}
          {{- end }}
          args:
            - --runtime=kube
            {{- if eq .Values.storage.mode "hostpath" }}
            - --kube-node={{ .Values.node }}
            {{- end }}
            - --kube-data-root={{ .Values.dataRoot }}
            {{- with .Values.helperImage }}
            - --kube-helper-image={{ . }}
            {{- end }}
            {{- if eq .Values.storage.mode "csi" }}
            - --kube-storage=csi
            - --csi-storage-class={{ required "set storage.storageClass to a StorageClass supporting PVC cloning (required with storage.mode=csi)" .Values.storage.storageClass }}
            {{- with .Values.storage.snapshotClass }}
            - --csi-snapshot-class={{ . }}
            {{- end }}
            {{- with .Values.storage.volumeSize }}
            - --csi-volume-size={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.rotateBranchCredentials }}
            - --rotate-branch-credentials
            {{- end }}
            - --api-addr=:{{ .Values.api.port }}
            - --pg-addr=:{{ .Values.proxy.port }}
            {{- with .Values.proxy.tls.certSecret }}
            # wire-protocol TLS for the Postgres router (secret mounted below)
            - --pg-tls-cert=/etc/pgoverlay/proxy-tls/tls.crt
            - --pg-tls-key=/etc/pgoverlay/proxy-tls/tls.key
            {{- end }}
            - --reconcile-interval={{ .Values.reconcileInterval }}
            - --stuck-timeout={{ .Values.stuckTimeout }}
            - --shutdown-timeout={{ int .Values.shutdownTimeout }}s
            {{- if not (has .Values.seedSettle (list "freeze" "recover" "off")) }}
            {{- fail "seedSettle must be freeze, recover or off" }}
            {{- end }}
            - --seed-settle={{ .Values.seedSettle }}
            {{- if eq (include "pgoverlay.leaderElectionEnabled" .) "true" }}
            # HA: contend for the pgoverlay-branchd Lease; only the leader
            # reconciles + accepts mutating /v1 requests (see docs/ha.md).
            - --leader-elect
            {{- end }}
          env:
            - name: PGOVERLAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pgoverlay.tokenSecretName" . }}
                  key: token
            # sqlite registry on the storage node (mounted below)
            - name: PGOVERLAY_HOME
              value: {{ .Values.dataRoot }}/state
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # branchd makes its own pod the owner of the helper pods (and their
            # env Secrets) it starts, so they are garbage-collected with it if
            # branchd dies mid-seed.
            - name: PGOVERLAY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PGOVERLAY_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- if eq (include "pgoverlay.leaderElectionEnabled" .) "true" }}
            # leader-election identity (the Lease holder)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.api.port }}
            - name: proxy
              containerPort: {{ .Values.proxy.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          # /readyz is real readiness: registry reachable + driver responds
          # (liveness above is just process-up). Both are unauthenticated.
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
          securityContext:
            # root for write access to the hostPath state dir (see values.yaml);
            # the rest of the controls are valid regardless of UID. The state
            # dir is a real volume (hostPath/PVC) and /tmp is an emptyDir below,
            # so the container rootfs can be read-only.
            runAsUser: {{ .Values.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: {{ .Values.dataRoot }}/state
            # writable scratch with readOnlyRootFilesystem (sqlite temp files,
            # exec'd tooling). Not the registry — that is the state volume.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.proxy.tls.certSecret }}
            - name: proxy-tls
              mountPath: /etc/pgoverlay/proxy-tls
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          {{- if eq (include "pgoverlay.persistenceEnabled" .) "true" }}
          persistentVolumeClaim:
            claimName: {{ include "pgoverlay.fullname" . }}-state
          {{- else }}
          hostPath:
            path: {{ .Values.dataRoot }}/state
            type: DirectoryOrCreate
          {{- end }}
        {{- with .Values.proxy.tls.certSecret }}
        - name: proxy-tls
          secret:
            secretName: {{ . }}
        {{- end }}
