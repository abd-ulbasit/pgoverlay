{{- if .Values.networkPolicy.enabled }}
# NetworkPolicies for pgoverlay. OFF by default (networkPolicy.enabled=false) so
# existing installs don't suddenly lose connectivity, but RECOMMENDED for any
# shared/multi-tenant cluster. Requires a CNI that enforces NetworkPolicy
# (Calico, Cilium, etc.); on a CNI without enforcement these are inert.
#
# Three policies:
#  1. ingress to branchd (API + proxy) — from ghook, configured client
#     selectors, and the metrics scrape source.
#  2. branch pods — ingress only from branchd; egress only to cluster DNS.
#     Branch pods never contact the Postgres source: they run on local
#     volumes (overlay layers or PVC clones) seeded beforehand.
#  3. helper pods — no ingress; when networkPolicy.sourceEgress is set,
#     egress only to cluster DNS and those source(s). Helpers are what seed
#     from the source (pg_basebackup / pg_dump, with its password).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgoverlay.fullname" . }}-branchd
  labels:
    {{- include "pgoverlay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pgoverlay.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # ghook -> branchd REST API (in-cluster webhook receiver).
    {{- if .Values.ghook.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "pgoverlay.ghook.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    {{- end }}
    # Configured clients (pgb CLI users, preview deployers, app pods) -> API +
    # proxy. Each entry is a raw NetworkPolicyPeer (namespaceSelector and/or
    # podSelector); see values.yaml networkPolicy.allowedClients.
    {{- with .Values.networkPolicy.allowedClients }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.api.port }}
        - protocol: TCP
          port: {{ $.Values.proxy.port }}
    {{- end }}
    # Metrics scrape source (Prometheus) -> API port (/metrics is served there).
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.api.port }}
    {{- end }}
---
# Branch and helper pods are created by branchd at RUNTIME (not by this chart).
# The Go runtime stamps them with pgoverlay.managed=true and
# pgoverlay.role=branch|helper (see internal/engine branchLabels /
# internal/runtime). These policies select on those labels; if the runtime
# label scheme changes, update them here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgoverlay.fullname" . }}-branch-pods
  labels:
    {{- include "pgoverlay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      pgoverlay.managed: "true"
      pgoverlay.role: branch
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only branchd (API + proxy live in the same pod) reaches branch Postgres.
    - from:
        - podSelector:
            matchLabels:
              {{- include "pgoverlay.selectorLabels" . | nindent 14 }}
  egress:
    # Cluster DNS only. A branch is a copy of production that developers get
    # superuser on; it has no business reaching the production source (or
    # anything else) over the network, e.g. through dblink or COPY ... PROGRAM.
    - to:
        {{- include "pgoverlay.dnsPeers" . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgoverlay.fullname" . }}-helper-pods
  labels:
    {{- include "pgoverlay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      pgoverlay.managed: "true"
      pgoverlay.role: helper
  policyTypes:
    # Nothing connects to a helper (logs and exec go through the kubelet).
    - Ingress
    {{- if .Values.networkPolicy.sourceEgress }}
    - Egress
  egress:
    # Cluster DNS, to resolve the source's host name.
    - to:
        {{- include "pgoverlay.dnsPeers" . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Postgres source(s) seeding reads from.
    - to:
        {{- toYaml .Values.networkPolicy.sourceEgress | nindent 8 }}
      {{- with .Values.networkPolicy.sourcePorts }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
