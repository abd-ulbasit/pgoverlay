# A starting point for a shared or production-like cluster. values.yaml keeps
# the single-node, first-run defaults (hostpath, inherited credentials, no
# NetworkPolicy, no limits); every value below is a deliberate departure from
# them, explained in docs/security.md ("Hardening checklist").
#
#   kubectl create namespace pgoverlay
#   kubectl label namespace pgoverlay pod-security.kubernetes.io/enforce=baseline
#   # Secrets first, out of band, so no value lands in the Helm release
#   # history (docs/kubernetes.md, docs/eks.md):
#   printf '%s' "$(openssl rand -hex 32)" | \
#     kubectl -n pgoverlay create secret generic pgoverlay-token --from-file=token=/dev/stdin
#   helm install pgoverlay deploy/helm/pgoverlay -n pgoverlay \
#     -f deploy/helm/pgoverlay/values-production.yaml \
#     --set storage.storageClass=<a StorageClass that supports PVC cloning>
#
# Pin the images by digest (image.digest, ghook.image.digest) once you have
# verified the release (SECURITY.md, "Release integrity").

# Branches as PVC clones: no added capabilities on branch pods, the namespace
# can enforce Pod Security "baseline", and the registry lives on a PVC.
storage:
  mode: csi
  # REQUIRED: set with --set storage.storageClass=... (rendering fails
  # without it).
  storageClass: ""

# The API token comes from a Secret created out of band (see above).
existingSecret: pgoverlay-token

# Every branch gets its own generated password instead of accepting the
# source's production password.
rotateBranchCredentials: true

# Wire-protocol TLS for the router: a Secret with tls.crt and tls.key, e.g.
# from cert-manager (docs/kubernetes.md, "Proxy TLS").
proxy:
  tls:
    certSecret: pgoverlay-proxy-tls

# Needs a CNI that enforces NetworkPolicy. Add allowedClients, metricsFrom
# and sourceEgress for your cluster (values.yaml networkPolicy).
networkPolicy:
  enabled: true

limits:
  maxBranches: 50
  defaultTTL: 72h
  maxTTL: 168h

namespaceLimitRange:
  enabled: true

# Inert until ghook.enabled=true. Then its secrets come from Secrets created
# out of band too, it uses an operator token, and it refuses to branch a
# source with no masking scripts.
ghook:
  existingSecret: pgoverlay-ghook
  apiTokenSecret: pgoverlay-ghook-api
  requireMask: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
