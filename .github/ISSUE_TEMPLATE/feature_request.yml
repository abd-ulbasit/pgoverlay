name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. CLI flags, API shape or Helm values are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
  - type: markdown
    attributes:
      value: |
        pgoverlay is a dev/test tool; merging branch data back and multi-writer
        branches are non-goals (see the Scope section of the README).
