name: release

# A release is a pushed semver tag (v1.0.0, or v1.1.0-rc.1 for a
# pre-release). The tag is gated on the full CI suite at the tagged commit,
# then publishes:
#   - pgb, branchd and pgoverlay-github for linux/darwin x amd64/arm64, with
#     checksums.txt and build provenance, as a GitHub release (goreleaser);
#   - multi-arch (linux/amd64, linux/arm64) images
#     ghcr.io/abd-ulbasit/pgoverlay-branchd:<tag> and pgoverlay-ghook:<tag>,
#     built from the repository's Dockerfiles with SBOM and provenance,
#     scanned with trivy before they are pushed, signed with cosign (keyless)
#     and with a provenance attestation pushed to the registry, all by digest;
#   - for a stable tag, `latest` on both images and the floating major tag
#     (v1) that `uses: abd-ulbasit/pgoverlay/action@v1` resolves to.
#
# Before tagging, set deploy/helm/pgoverlay/Chart.yaml appVersion to the tag:
# it is the image tag the chart pulls by default, and the preflight job
# refuses a tag it does not match.
#
# Every job that publishes (binaries, images, the major tag) runs in the
# `release` environment, so its protection rules (required reviewers, and a
# deployment rule allowing only v* tags) decide whether a pushed tag actually
# ships. The environment and its rules are repository settings, not code:
# without them the jobs still run, unprotected.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the chart pulls the image this tag publishes
        run: |
          app=$(awk -F': *' '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' deploy/helm/pgoverlay/Chart.yaml)
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=deploy/helm/pgoverlay/Chart.yaml::appVersion is '$app' but the tag is '$GITHUB_REF_NAME'. appVersion is the image tag the chart installs by default; set it to the tag in the release commit and tag again."
            exit 1
          fi

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the previous tag for the changelog
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1 # keep in step with GORELEASER_VERSION in the Makefile (make check-toolchain compares them)
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  images:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io, including the signature and attestation
      id-token: write # keyless cosign signature and provenance (Sigstore via OIDC)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pgoverlay-branchd
            dockerfile: Dockerfile
          - image: pgoverlay-ghook
            dockerfile: Dockerfile.ghook
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tags and build args
        id: meta
        run: |
          # The image tag is the git tag verbatim (v-prefixed), which is what
          # Chart.yaml appVersion names. `latest` only moves on a stable tag.
          tags="$IMAGE:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          {
            echo "tags=$tags"
            # Same values goreleaser stamps into the release binaries.
            echo "version=$GITHUB_REF_NAME"
            echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Trivy is installed from its release tarball and checked against the
      # sha256 published for it, not through aquasecurity/trivy-action or
      # setup-trivy: in March 2026 both had their tags force-pushed to
      # credential-stealing code (GHSA-69fq-xp46-6x23), and this job holds a
      # registry write token. Bump version and checksum together.
      - name: Install trivy
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  trivy.tar.gz\n' "$TRIVY_SHA256" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy && sudo mv trivy /usr/local/bin/trivy && rm trivy.tar.gz
          trivy --version
      # The scan gate runs BEFORE anything is pushed. Each platform is built
      # into the local daemon (the runtime stage has no RUN, so arm64 needs no
      # emulation) and scanned; the push below reuses the same builder's
      # cache, so it publishes these layers.
      #
      # The gate is the OS packages (Alpine) with a released fix, HIGH and
      # CRITICAL. Go code is gated by the `vuln` job (govulncheck: reachable
      # code only, with a reviewed allowlist that expires); trivy's Go
      # findings are by module version, reachable or not, so they are
      # printed here for the record but do not gate.
      - name: Scan the images before pushing
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            ref="scan/${IMAGE##*/}:${platform##*/}"
            docker buildx build --platform "$platform" --load --provenance=false --sbom=false \
              -f "$DOCKERFILE" -t "$ref" \
              --build-arg VERSION="$VERSION" --build-arg COMMIT="$GITHUB_SHA" --build-arg DATE="$DATE" .
            echo "::group::Go modules in $ref (informational; the vuln job gates Go)"
            trivy image --quiet --scanners vuln --pkg-types library \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$ref"
            echo "::endgroup::"
            trivy image --quiet --scanners vuln --pkg-types os \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$ref"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      # Keyless: the certificate names this workflow at this tag, and the
      # signature goes to the registry next to the image, by digest. Verify
      # with `cosign verify` as SECURITY.md shows.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the image (cosign, keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # The same SLSA provenance the binaries get, for the image digest, and
      # pushed to the registry so `gh attestation verify oci://...` and
      # registry-side policy (e.g. a Kubernetes admission controller) find it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >>"$GITHUB_STEP_SUMMARY"

  # Actions convention: `v1` names the newest stable v1.x.y. Only a stable tag
  # moves it, and only once its binaries and images are published.
  action-major-tag:
    needs: [binaries, images]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # move the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: point the major tag at this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
          echo "$major -> $GITHUB_REF_NAME ($GITHUB_SHA)" >>"$GITHUB_STEP_SUMMARY"
