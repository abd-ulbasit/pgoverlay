name: release

# A release is a pushed semver tag (v1.0.0, or v1.1.0-rc.1 for a
# pre-release). The tag is gated on the full CI suite at the tagged commit,
# then publishes:
#   - pgb, branchd and pgoverlay-github for linux/darwin x amd64/arm64, with
#     checksums.txt and build provenance, as a GitHub release (goreleaser);
#   - multi-arch (linux/amd64, linux/arm64) images
#     ghcr.io/abd-ulbasit/pgoverlay-branchd:<tag> and pgoverlay-ghook:<tag>,
#     built from the repository's Dockerfiles with SBOM and provenance;
#   - for a stable tag, `latest` on both images and the floating major tag
#     (v1) that `uses: abd-ulbasit/pgoverlay/action@v1` resolves to.
#
# Before tagging, set deploy/helm/pgoverlay/Chart.yaml appVersion to the tag:
# it is the image tag the chart pulls by default, and the preflight job
# refuses a tag it does not match.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the chart pulls the image this tag publishes
        run: |
          app=$(awk -F': *' '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' deploy/helm/pgoverlay/Chart.yaml)
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=deploy/helm/pgoverlay/Chart.yaml::appVersion is '$app' but the tag is '$GITHUB_REF_NAME'. appVersion is the image tag the chart installs by default; set it to the tag in the release commit and tag again."
            exit 1
          fi

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the previous tag for the changelog
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2 # keep in step with GORELEASER_VERSION in the Makefile
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pgoverlay-branchd
            dockerfile: Dockerfile
          - image: pgoverlay-ghook
            dockerfile: Dockerfile.ghook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tags and build args
        id: meta
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          # The image tag is the git tag verbatim (v-prefixed), which is what
          # Chart.yaml appVersion names. `latest` only moves on a stable tag.
          tags="$IMAGE:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          {
            echo "tags=$tags"
            # Same values goreleaser stamps into the release binaries.
            echo "version=$GITHUB_REF_NAME"
            echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

  # Actions convention: `v1` names the newest stable v1.x.y. Only a stable tag
  # moves it, and only once its binaries and images are published.
  action-major-tag:
    needs: [binaries, images]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: point the major tag at this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
          echo "$major -> $GITHUB_REF_NAME ($GITHUB_SHA)" >>"$GITHUB_STEP_SUMMARY"
