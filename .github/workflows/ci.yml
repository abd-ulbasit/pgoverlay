name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# unit/integration/helm are fast. The `kube` job stands up a kind cluster and
# runs the Kubernetes + HA-failover suites (CSI best-effort). The Postgres
# version matrix still runs locally via the Makefile.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The golang base image pins GOTOOLCHAIN=local, so a Dockerfile trailing
      # go.mod's `go` directive fails at `RUN go mod download` — which is how
      # `make docker-build` and the helm ITs silently broke once already.
      - run: make check-toolchain
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      # -race: the registry CAS, pgproxy connection cap, and reconcile loop are
      # concurrent; the race detector guards them (IT suites stay env-gated, so
      # this is the unit set).
      - run: go test ./... -race -count=1

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The gate itself lives in hack/vulncheck.sh so `make vuln` reproduces it
      # byte for byte on a laptop. Rationale for the module-scoped allowlist is
      # in that script and in SECURITY.md.
      - name: govulncheck (binary mode + module-scoped allowlist)
        run: make vuln

  integration:
    runs-on: ubuntu-latest # Docker preinstalled; overlay tests use --cap-add SYS_ADMIN
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pre-pull images
        run: |
          docker pull -q postgres:17
          docker pull -q alpine:3.21
      # -p 1: serialize packages. The IT suites each spin Postgres containers
      # with published ephemeral ports; running packages in parallel on one
      # daemon races those ports ("address already in use"). Serializing trades
      # a little speed for determinism.
      - run: PGBRANCH_IT=1 go test ./... -count=1 -p 1 -timeout 25m

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-test

  kube:
    runs-on: ubuntu-latest # Docker preinstalled; the ITs create their own kind cluster
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: Install kind + kubectl
        run: |
          curl -fsSL -o kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          chmod +x kind kubectl && sudo mv kind kubectl /usr/local/bin/
      # Gate: the Kubernetes runtime-driver suite (hostPath volumes, helper
      # pods, branch pods, overlay-in-pod). It bootstraps the kind cluster
      # (hack/kind-up.sh) and loads its images itself.
      - name: Kubernetes runtime ITs (kind, hostPath)
        run: PGBRANCH_K8S_IT=1 go test ./internal/runtime/ -count=1 -timeout 25m
      # Gate: the end-to-end helm-deploy and HA-failover suites. These were
      # `continue-on-error: true` while their timing was "still being hardened
      # for hosted runners" — but what they were actually reporting was two
      # real defects (a Dockerfile toolchain mismatch, and a port-forward
      # pinned to the wrong namespace and then to the pod the test kills). The
      # badge stayed green over "--- FAIL: TestHelmDeployEndToEnd" for weeks,
      # which is worse than having no badge. Fixed and green on two
      # consecutive runs, so it gates again.
      - name: Helm deploy + HA-failover ITs (kind)
        run: PGBRANCH_K8S_IT=1 go test ./internal/deploy/ -count=1 -timeout 25m
      # Still best-effort, and for a reason that is not pgbranch's code: the
      # csi-driver-host-path install itself is flaky on hosted runners. It does
      # not gate, but the summary step below makes sure "does not gate" never
      # again means "nobody finds out".
      - name: CSI ITs (best-effort — csi-driver-host-path install can be flaky)
        id: csi_its
        continue-on-error: true
        run: |
          hack/kind-csi-up.sh
          PGBRANCH_CSI_IT=1 go test ./internal/runtime/ -run CSI -count=1 -timeout 20m
      - name: Best-effort suite outcomes
        if: always()
        env:
          CSI: ${{ steps.csi_its.outcome }}
        run: |
          {
            echo "## Best-effort Kubernetes suites"
            echo ""
            echo "These do not gate the build. A failure here still means something is broken."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          note() {
            if [ "$2" = "success" ]; then
              echo "- PASS — $1" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Best-effort suite failed::$1 ended as '$2' — not gating, but not passing either"
              echo "- **FAIL ($2)** — $1" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          note "CSI ITs" "$CSI"
