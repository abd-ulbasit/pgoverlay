name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, with no commit needed: new advisories reach the vuln DB and new
  # postgres images are published whether or not anyone pushes. The scheduled
  # run is the vuln gate plus the Postgres version matrix.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # release.yml calls this workflow for every v* tag, so a release is gated on
  # the whole suite, vuln gate included, at the tagged commit.
  workflow_call:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Third-party actions are pinned to commit SHAs (Dependabot keeps the pins
# and their version comments current). Downloaded tools are pinned to a
# version and, where they are not installed by a pinned action, a sha256.
#
# unit/vuln/js/images/integration/helm are fast. The `kube` job stands up a
# kind cluster and runs the Kubernetes + HA-failover suites (CSI best-effort).
# `pg-matrix` runs the Postgres 14-18 version matrix on the weekly schedule
# (and on demand). `lazyrw`, `pg-import-audit` and `integration-arm64` guard
# the copy-on-write shim (internal/cow/lazyrw): its committed builds, the
# libc functions Postgres writes through, and arm64.
jobs:
  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The golang base image pins GOTOOLCHAIN=local, so a Dockerfile trailing
      # go.mod's `go` directive fails at `RUN go mod download` — which is how
      # `make docker-build` and the helm ITs silently broke once already. It
      # also keeps the goreleaser pin buildable with go.mod's Go (make
      # release-check runs it with go run) and equal in the Makefile and
      # release.yml.
      - run: make check-toolchain
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      # -race: the registry CAS, pgproxy connection cap, and reconcile loop are
      # concurrent; the race detector guards them (IT suites stay env-gated, so
      # this is the unit set).
      - run: go test ./... -race -count=1

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The gate itself lives in hack/vulncheck.sh so `make vuln` reproduces it
      # byte for byte on a laptop. It pins govulncheck and fails closed; the
      # accepted advisories are in hack/vuln-allowlist.txt (see SECURITY.md).
      - name: vuln gate self-test (stub scanner, offline)
        run: make vuln-test
      - name: govulncheck (binary mode, per-advisory allowlist)
        run: make vuln

  js:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines: node >= 18; the oldest supported and the current LTS lines
        node: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Both SDKs, sdk/js (pgoverlay-test) and sdk/js-connect
      # (pgoverlay-connect): node --test plus an `npm pack --dry-run`.
      - run: make js-sdk-test

  images:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.ghook]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both architectures the release publishes. The build stage
      # cross-compiles from the runner's platform, so no emulation is needed.
      - name: build ${{ matrix.dockerfile }} (linux/amd64, linux/arm64)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker buildx build --platform linux/amd64,linux/arm64 -f "$DOCKERFILE" .

  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest # Docker preinstalled; overlay tests use --cap-add SYS_ADMIN
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: pre-pull images
        run: |
          docker pull -q postgres:17
          docker pull -q alpine:3.21
      # -p 1: serialize packages. The IT suites each spin Postgres containers
      # with published ephemeral ports; running packages in parallel on one
      # daemon races those ports ("address already in use"). Serializing trades
      # a little speed for determinism. `make it` runs the same command.
      - run: make it

  # The lazyrw LD_PRELOAD shim's four builds (glibc and musl, amd64 and
  # arm64) and the two static pgoverlay-du builds are committed so `go
  # install` needs no C toolchain. Rebuild them from source and fail on any
  # byte of difference, then run the C tests on a real OverlayFS mount and
  # the pgoverlay-du functional test (amd64 here, arm64 natively in
  # integration-arm64).
  # The build uses a docker-container buildx builder whose bundled QEMU
  # covers arm64, so no binfmt set-up is needed.
  lazyrw:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: committed builds are reproducible from source
        run: make lazyrw-check
      - name: C tests on a real overlay (linux/amd64, glibc and musl) and pgoverlay-du
        run: make lazyrw-test

  # Every write-class libc function the postgres binary of postgres:14-18 and
  # 17-alpine imports must be interposed by the shim or be on the reviewed
  # allowlist (internal/cow/lazyrw/audit): a write the shim does not see hits
  # a read-only fd. Also weekly, because new postgres images are published
  # without a commit here.
  pg-import-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: postgres imports vs the shim (linux/amd64 and linux/arm64)
        env:
          PG_AUDIT_PLATFORMS: linux/amd64 linux/arm64
        run: make pg-import-audit

  # arm64: Apple Silicon Docker Desktop, Colima and OrbStack run arm64
  # postgres images. The shim's arm64 builds get their C tests natively here,
  # then the copy-on-write integration tests (internal/engine, names matching
  # Cow) run against arm64 postgres; while none exist the step runs nothing
  # and passes.
  integration-arm64:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: lazyrw C tests on a real overlay (linux/arm64, glibc and musl) and pgoverlay-du
        run: make lazyrw-test
      - name: pre-pull images
        run: |
          docker pull -q postgres:17
          docker pull -q alpine:3.21
      - name: copy-on-write integration tests (arm64)
        run: PGOVERLAY_IT=1 go test ./internal/engine/ -run Cow -count=1 -p 1 -timeout 30m -v

  pg-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The supported range (README "Supported Postgres versions"): 14 is the
        # floor because branch startup passes recovery_init_sync_method.
        pg: ["14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: seed -> branch -> verify -> destroy on postgres ${{ matrix.pg }}
        env:
          PGOVERLAY_MATRIX_VERSIONS: ${{ matrix.pg }}
        run: |
          docker pull -q "postgres:${PGOVERLAY_MATRIX_VERSIONS}"
          docker pull -q alpine:3.21
          make matrix

  helm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - run: make helm-test

  kube:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest # Docker preinstalled; the ITs create their own kind cluster
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      # Checksums are the upstream-published sha256 of these exact releases,
      # written down here so a tampered download fails instead of running as
      # root. Bump version and checksum together.
      - name: Install kind + kubectl
        env:
          KIND_VERSION: v0.27.0
          KIND_SHA256: a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b
          KUBECTL_VERSION: v1.31.0
          KUBECTL_SHA256: 7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          printf '%s  kind\n%s  kubectl\n' "$KIND_SHA256" "$KUBECTL_SHA256" | sha256sum --check --strict
          chmod +x kind kubectl && sudo mv kind kubectl /usr/local/bin/
      # Gate: the Kubernetes runtime-driver suite (hostPath volumes, helper
      # pods, branch pods, overlay-in-pod). It bootstraps the kind cluster
      # (hack/kind-up.sh) and loads its images itself.
      - name: Kubernetes runtime ITs (kind, hostPath)
        run: PGOVERLAY_K8S_IT=1 go test ./internal/runtime/ -count=1 -timeout 25m
      # Gate: the end-to-end helm-deploy and HA-failover suites. Every
      # port-forward in them waits for its pod to be Running and Ready first
      # (waitPodReady): the HA suite once forwarded to a replacement pod that
      # had already won the Lease but was still ContainerCreating.
      - name: Helm deploy + HA-failover ITs (kind)
        run: PGOVERLAY_K8S_IT=1 go test ./internal/deploy/ -count=1 -timeout 25m
      # Still best-effort, and for a reason that is not pgoverlay's code: the
      # csi-driver-host-path install itself is flaky on hosted runners. It does
      # not gate, but the summary step below makes sure "does not gate" never
      # again means "nobody finds out".
      - name: CSI ITs (best-effort — csi-driver-host-path install can be flaky)
        id: csi_its
        continue-on-error: true
        run: |
          hack/kind-csi-up.sh
          PGOVERLAY_CSI_IT=1 go test ./internal/runtime/ -run CSI -count=1 -timeout 20m
      - name: Best-effort suite outcomes
        if: always()
        env:
          CSI: ${{ steps.csi_its.outcome }}
        run: |
          {
            echo "## Best-effort Kubernetes suites"
            echo ""
            echo "These do not gate the build. A failure here still means something is broken."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          note() {
            if [ "$2" = "success" ]; then
              echo "- PASS — $1" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Best-effort suite failed::$1 ended as '$2' — not gating, but not passing either"
              echo "- **FAIL ($2)** — $1" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          note "CSI ITs" "$CSI"
