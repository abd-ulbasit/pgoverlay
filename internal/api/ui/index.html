<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pgoverlay</title>
<!-- styles and script are separate same-origin files so the page can run
     under a strict Content-Security-Policy (no inline code); see ui.go -->
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>pgoverlay<span class="cursor">_</span></h1>
  <span class="dim">copy-on-write Postgres branches</span>
  <span class="spacer"></span>
  <label class="dim" for="token">token</label>
  <input id="token" type="password" placeholder="PGOVERLAY_TOKEN" autocomplete="off">
</header>
<div id="msg"></div>

<h2>sources</h2>
<table>
  <thead><tr><th>name</th><th>pg</th><th>gen</th><th>state</th><th>upstream</th></tr></thead>
  <tbody id="sources"><tr><td class="empty" colspan="5">loading…</td></tr></tbody>
</table>

<h2>branches</h2>
<table>
  <thead><tr><th>name</th><th>source</th><th>state</th><th>endpoint</th><th>expires</th><th>size</th><th></th></tr></thead>
  <tbody id="branches"><tr><td class="empty" colspan="7">loading…</td></tr></tbody>
</table>
<form class="create" id="create">
  <input id="bname" placeholder="branch name" pattern="[a-z0-9][a-z0-9-]{0,40}" required>
  <select id="bsource" required></select>
  <select id="bparent" title="create from another branch's current state instead of the source"></select>
  <input id="bttl" placeholder="ttl (e.g. 24h, blank = never)" size="22">
  <button type="submit">create branch</button>
</form>

<script src="app.js"></script>
</body>
</html>
