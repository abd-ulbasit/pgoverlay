# Delete a pgoverlay branch by name. Run it with `if: always()` so the branch
# goes away even when the tests fail:
#
#   - uses: abd-ulbasit/pgoverlay/action/destroy@main
#     if: always()
#     with:
#       server: ${{ vars.PGOVERLAY_SERVER }}
#       token: ${{ secrets.PGOVERLAY_TOKEN }}
#       branch: ${{ steps.branch.outputs.branch }}
name: pgoverlay destroy
description: Delete a pgoverlay branch by name (404 counts as success)
author: abd-ulbasit
branding:
  icon: trash-2
  color: blue

inputs:
  server:
    description: branchd base URL (e.g. https://pgoverlay.example.com)
    required: true
  token:
    description: pgoverlay API bearer token (store it as a secret)
    required: true
  branch:
    description: branch name to delete (the create action's `branch` output)
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PGOVERLAY_SERVER: ${{ inputs.server }}
        PGOVERLAY_TOKEN: ${{ inputs.token }}
        PGOVERLAY_BRANCH: ${{ inputs.branch }}
      run: '"$GITHUB_ACTION_PATH/entrypoint.sh"'
